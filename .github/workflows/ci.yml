name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci || npm install; fi
          if [ -f client/package.json ]; then cd client && npm ci || npm install; fi
          if [ -f frontend/package.json ]; then cd frontend && npm ci || npm install; fi
      - name: Build
        run: |
          if [ -f package.json ]; then npm run build --if-present; fi
        continue-on-error: true
